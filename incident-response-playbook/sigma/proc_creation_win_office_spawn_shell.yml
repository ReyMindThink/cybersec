title: Office Application Spawning Command Shell
id: 3f9c1a52-7b0e-4d6a-9c41-2e8d5b7a1f06
status: experimental
description: >
  Detects a Microsoft Office application starting a command shell or script host.
  Common after a user opens a malicious email attachment (phishing).
references:
  - https://attack.mitre.org/techniques/T1566/
author: ReyMindThink
date: 2026-11-07
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.execution
  - attack.t1204
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Legitimate macros or add-ins in business documents that run scripts
level: high
